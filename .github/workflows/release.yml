name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: aidoit-linux-x86_64.tar.gz
            binary_name: aidoit
          - os: macos-13
            target: x86_64-apple-darwin
            archive_name: aidoit-macos-x86_64.tar.gz
            binary_name: aidoit
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: aidoit-macos-aarch64.tar.gz
            binary_name: aidoit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: aidoit-windows-x86_64.zip
            binary_name: aidoit.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 构建二进制
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包 Unix 二进制
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" .
          tar -czf "${{ matrix.archive_name }}" "${{ matrix.binary_name }}"

      - name: 打包 Windows 二进制
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" .
          Compress-Archive -Path "${{ matrix.binary_name }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
